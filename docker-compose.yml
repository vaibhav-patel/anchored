services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: anchored-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ingest.geoip.downloader.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - es_data:/usr/share/elasticsearch/data

  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: anchored-app
    depends_on:
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ES_URL=http://elasticsearch:9200
      - FASTEMBED_CACHE_PATH=/models
      - OMP_NUM_THREADS=3
    volumes:
      - ./anchored:/app/anchored
      - ./evals:/app/evals
      - ./data:/app/data
      - ./traces:/app/traces
      - ./BASELINE.md:/app/BASELINE.md
      - model_cache:/models
    ports:
      - "8000:8000"
    # Cap resources so an embedding run can never starve the host machine.
    deploy:
      resources:
        limits:
          cpus: "3.0"
          memory: 3g
    # Serve the demo UI; still exec-able for ingest/index/baseline.
    command: ["uvicorn", "anchored.api:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  es_data:
  model_cache:
