[project]
name = "anchored"
version = "0.1.0"
description = "Grounded, eval-instrumented agentic RAG — answers anchored to verifiable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Patel" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "elasticsearch>=8.13,<9",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "fastembed>=0.3",
    "tiktoken>=0.7",
]

[project.scripts]
anchored = "anchored.cli:app"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.2",
]
notebook = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anchored"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks follow notebook conventions (semicolons to suppress output, etc.); we lint the
# builder script (notebooks/build_explore.py) instead.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The notebook builder embeds markdown/table strings that exceed the line length.
"notebooks/build_explore.py" = ["E501"]
